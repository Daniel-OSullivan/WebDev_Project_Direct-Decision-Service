<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="../css/contact.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="sale.html">Sale</a></li>
    </ul>
  </nav>

  <!-- Header -->
  <header>
    <h1><strong><u>Get in touch with Wheels On Fire</u></strong></h1>
  </header>

  <!-- Grid Layout -->
  <main class="grid-container">
    <!-- Row 2 -->
    <div class="top-left-image">
      <img src="../media/car3.jpg" alt="Top Left Car" />
    </div>

    <div class="email-input">
      <form>
        <label for="email"><u><strong>Enter your Email:</strong></u></label>
        <input type="email" id="email" name="email" placeholder="johndoe@gmail.com" required />
        <input type="submit" value="Submit" />
      </form>
    </div>

    <div class="top-right-image">
      <img src="../media/car4.jpg" alt="Top Right Car" />
    </div>

    <!-- Row 3 -->
    <div class="row3-left-image">
      <img src="../media/car6.jpg" alt="Left Side Car" />
    </div>

    <div class="row3-center">
      <div class="input-container">
        <form>
          <label for="paragraphBox"><strong><u>Enter your message:</u></strong></label>
          <textarea id="paragraphBox" name="message" placeholder="Type your concerns here..." required></textarea>
          <input type="submit" value="Submit" />
        </form>
      </div>
      <div class="contact-info">
        <p><strong><u>Phone Number</u></strong><br>086-123-1234</p>
        <p><strong><u>Email</u></strong><br>DDS@Gmail.com</p>
      </div>
    </div>

    <div class="row3-right-image">
      <img src="../media/car5.jpg" alt="Right Side Car" />
    </div>

    
  </main>

</body>
</html>
