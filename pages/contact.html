<body>
  
    <!-- Navbar -->
    <nav class="navbar">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="sale.html">For Sale</a></li>

    <!-- Landing page content -->
    <div class="image-container">
          <img src="../media/image.jpg" class="background-image" alt="background image">
    <div class="overlay"></div>


    <div class="content">
      <h1>Contact Us</h1>
      <p></p>
      <a href="#contact" class="btn">Get in touch</a>
    </div>
  </div>

  


<section id="contact" class="contact-section">
  <div class="container">
    <h2 class="contact-title">Contact Us</h2>
    <p class="contact-text">Got a question? Drop it below.</p>

    <!-- Single form with one submit at the bottom -->
    <form id="contact-form" action="#" method="post">
      <div class="name-input">
        <label for="email">Enter your Email:</label>
        <!-- fix: use type="email" so it picks up the dark input styles -->
        <input type="email" id="email" name="email" placeholder="johndoe@gmail.com" required>
      </div>

      <div class="genderOptions">
        <label for="gender">Enter your gender</label>
        <select id="gender" name="gender">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="NonBinary">Non-binary</option>
          <option value="PreferNotToSay">Prefer not to say</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="input-container">
        <label for="message">Enter your message:</label>
        <textarea id="message" name="message" placeholder="Type your concerns here..." required></textarea>
      </div>

      <!-- only one submit button -->
      <input type="submit" value="Submit">
    </form>

</section>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="brand">Wheels on Fire</div>
    <p class="contact-line">For any inquiries please contact us</p>
    <p class="contact-details"><span>Phone:</span> 086-123-1234 • <span>Email:</span> DDS@Gmail.com</p>
    <small>© 2025 Wheels on Fire. All rights reserved.</small>
  </div>
</footer>
</body>
</html>
