<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="../css/contact.css" />
  <script src="../scripts/index.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="sale.html">Sale</a></li>
    </ul>
  </nav>

  <!-- Header -->
  <header>
    <h1><strong><u>Get in touch with Wheels On Fire</u></strong></h1>
  </header>

  <!-- Grid Layout -->
  <main class="grid-container">
    <!-- Row 2 -->
    <div class="top-left-image">
      <img src="../media/car3.jpg" alt="Top Left Car" />
    </div>

    <div class="form">
      <form id="contactForm" novalidate>
        <label for="firstName">Enter your first name:</label>
        <input type="text" id="firstName" name="firstName" placeholder="John" required aria-describedby="firstNameError" />
        <small class="error" id="firstNameError" aria-live="polite"></small>

        <label for="lastName">Enter your last name:</label>
        <input type="text" id="lastName" name="lastName" placeholder="Doe" required aria-describedby="lastNameError" />
        <small class="error" id="lastNameError" aria-live="polite"></small>

        <label for="email">Enter your Email:</label>
        <input type="email" id="email" name="email" placeholder="johndoe@gmail.com" required aria-describedby="emailError" />
        <small class="error" id="emailError" aria-live="polite"></small>

        <!-- Reason dropdown -->
        <label for="reason">Reason for contacting:</label>
        <select id="reason" name="reason" required aria-describedby="reasonError">
          <option value="" disabled selected>Select a reason</option>
          <option value="general">General inquiry</option>
          <option value="sales">Sales / Enquiry</option>
          <option value="viewing">Book a viewing / Test drive</option>
          <option value="support">After-sales support</option>
          <option value="partnerships">Advertising / Partnerships</option>
          <option value="other">Other</option>
        </select>
        <small class="error" id="reasonError" aria-live="polite"></small>

        <label for="paragraphBox">Enter your message:</label>
        <textarea id="paragraphBox" name="message" placeholder="Type your concerns here..." required aria-describedby="messageError"></textarea>
        <small class="error" id="messageError" aria-live="polite"></small>

        <button type="submit" id="submitBtn">Submit</button>
      </form>
    </div>

    
    <div class="top-right-image">
      <img src="../media/car4.jpg" alt="Top Right Car" />
    </div>

    <!-- Row 3 -->
    <div class="row3-left-image">
      <img src="../media/car6.jpg" alt="Left Side Car" />
    </div>

    <div class="row3-center">
      <div class="input-container">
       
      </div>
      <div class="contact-info">
        <p><strong><u>Phone Number</u></strong><br>086-123-1234</p>
        <p><strong><u>Email</u></strong><br>DDS@Gmail.com</p>
      </div>
    </div>

    <div class="row3-right-image">
      <img src="../media/car5.jpg" alt="Right Side Car" />
    </div>

    
  </main>

</body>
</html>
