<h1>Get in touch with Wheels On Fire</h1>



<section id="contact" class="contact-section form-gradient">
  <div class="container">
    <div class="name-input">
    <form>
      <label for="name">Enter your Email:</label>
      <input type="nameText" id="name" name="name" placeholder="johndoe@gmail.com">

  </div>


<div class="genderOptions">

  <option value="Female">Female</option>
  <option value="NonBinary">Non-binary</option>

</select>
</div>
